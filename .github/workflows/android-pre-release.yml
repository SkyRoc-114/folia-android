# Android pre-release —— 推 tag（v*-android.*）自动构建 APK 并发布 pre-release。
#
# 触发：push tag 形如 v0.7.22-android.281；也可在 Actions 页手动触发（workflow_dispatch，
# 手动触发时从所选分支/提交构建，release tag 名取自 package.json 的 version）。
#
# 构建链路来自 ANDROID_PORT.md：npm 构建 web 产物（build:capacitor）→ npx cap sync android
# → gradlew assembleDebug。用 assembleDebug 而不是 assembleRelease：release 包还需单独签名配置，
# 而 debug 包同样用入库的稳定 keystore 签名（android/keystore.properties + android/app/folia-release.p12，
# 公开入库见该文件头注释），可直接侧载且覆盖安装连续。
#
# 签名核验：构建后用 keytool 比对证书指纹，与 keystore.properties 记档的不一致就失败——
# 防止再出现（.281-.292 期间）每版一张随机证书、用户无法升级的事故。
#
# android/gradle.properties 里 org.gradle.java.home 硬编码了维护者的 Windows JDK 路径，
# CI 用 -Dorg.gradle.java.home 指回 runner 的 JDK 21（命令行属性优先于 gradle.properties）。
#
# 依赖安装加 --ignore-scripts：tsc/vite/cap 不需要任何 install 脚本产物（esbuild 走
# 平台二进制可选依赖），却能避开 sharp/electron 在 CI 里拉 GitHub release 二进制的
# 不稳定下载（沙箱/CI 网络下曾多次超时）。

name: Android pre-release

on:
  push:
    tags:
      - 'v*-android.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v0.7.22-android.281）；留空则用 package.json 的 version 前面加 v'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 预装了 Android SDK 且许可目录就绪；不要用 android-actions/setup-android@v3，
      # 它对预装 sdkmanager 报「Wrong version in preinstalled sdkmanager」直接失败。
      # 这里只兜底确保许可全部接受，缺的组件让 gradle 自动下载。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install web dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund --ignore-scripts

      - name: Build web assets (build:capacitor)
        run: npm run build:capacitor

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # 诊断：keystore 两个文件是否完好检出（对比本地记档 blob sha256）、cap sync 之后
      # app/build.gradle 是否被改（md5 对照 git tag 内内容）、debug 变体实际解析到的签名配置。
      - name: Diagnose signing inputs
        run: |
          cd android
          echo "--- files ---"
          ls -la keystore.properties app/folia-release.p12
          sha256sum keystore.properties app/folia-release.p12
          echo "--- app/build.gradle after cap sync (md5 + signing sections) ---"
          md5sum app/build.gradle
          sed -n '/signingConfigs {/,/^    }/p' app/build.gradle | head -40
          echo "--- gradle signing report (tail) ---"
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:signingReport --no-daemon 2>&1 | tail -60

      - name: Assemble debug APK (JDK 21)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --no-daemon --stacktrace

      # 覆盖安装连续性的门禁：APK 证书指纹必须等于入库 keystore 记档的指纹。
      # .281-.292 每 runner 一张随机证书，任何两版都无法升级；这里漂移即 fail fast。
      # 解析用 scripts/apk_cert.py（纯标准库，读 v2/v3 签名块），不依赖 JDK/SDK：
      # runner 的 build-tools/apksigner 不可预期（.293 首跑就因它静默失败过一次）。
      - name: Verify APK signing certificate
        run: |
          EXPECTED="A8ED29C87807D2535BA1FD3AD37EB40E233386D606DB56D2D133B8CA4DFB9541"
          APK=android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          ACTUAL=$(python3 scripts/apk_cert.py --digest "$APK")
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate drifted from the committed keystore; over-install would break"
            exit 1
          fi

      # splits.abi（见 android/app/build.gradle）产出三种安装包，按惯例命名：
      # armv7 = armeabi-v7a、armv8 = arm64-v8a、universal = 全 ABI。
      - name: Rename APKs
        id: apk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          TAG="${TAG:-v${VERSION}}"
          OUT=android/app/build/outputs/apk/debug
          cp "$OUT/app-armeabi-v7a-debug.apk" "folia-${VERSION}-armv7.apk"
          cp "$OUT/app-arm64-v8a-debug.apk"  "folia-${VERSION}-armv8.apk"
          cp "$OUT/app-universal-debug.apk"  "folia-${VERSION}-universal.apk"
          ls -lh folia-*.apk
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: folia-*.apk
          tag_name: ${{ steps.apk.outputs.tag }}
          fail_on_unmatched_files: true
