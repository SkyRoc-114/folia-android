# Android pre-release —— 推 tag（v*-android.*）自动构建 APK 并发布 pre-release。
#
# 触发：push tag 形如 v0.7.22-android.281；也可在 Actions 页手动触发（workflow_dispatch，
# 手动触发时从所选分支/提交构建，release tag 名取自 package.json 的 version）。
#
# 构建链路来自 ANDROID_PORT.md：npm 构建 web 产物（build:capacitor）→ npx cap sync android
# → gradlew assembleDebug。用 assembleDebug 而不是 assembleRelease：仓库里没有签名密钥，
# 无签名 release 包无法安装；debug 包用 debug 密钥签名，可直接侧载。
#
# android/gradle.properties 里 org.gradle.java.home 硬编码了维护者的 Windows JDK 路径，
# CI 用 -Dorg.gradle.java.home 指回 runner 的 JDK 21（命令行属性优先于 gradle.properties）。
#
# 依赖安装加 --ignore-scripts：tsc/vite/cap 不需要任何 install 脚本产物（esbuild 走
# 平台二进制可选依赖），却能避开 sharp/electron 在 CI 里拉 GitHub release 二进制的
# 不稳定下载（沙箱/CI 网络下曾多次超时）。

name: Android pre-release

on:
  push:
    tags:
      - 'v*-android.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v0.7.22-android.281）；留空则用 package.json 的 version 前面加 v'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 补齐/接受 SDK 许可：runner 预装的 SDK 缺平台 36.1 时 gradle 会自动下载
      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund --ignore-scripts

      - name: Build web assets (build:capacitor)
        run: npm run build:capacitor

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK (JDK 21)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          TAG="${TAG:-v${VERSION}}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "folia-${VERSION}.apk"
          echo "APK: folia-${VERSION}.apk ($(du -h "folia-${VERSION}.apk" | cut -f1)) -> tag ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: folia-*.apk
          tag_name: ${{ steps.apk.outputs.tag }}
          fail_on_unmatched_files: true
