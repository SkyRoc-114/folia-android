# 当前文件：Android 稳定发布签名（本仓库公开入库，见下方说明）。
#
# 为什么签名材料公开：CI 从 .281 起用 runner 现场生成的 debug keystore 签 assembleDebug，
# runner 一次一命，每个版本一张随机证书——任何两版之间都无法覆盖安装（.282/.286/.288/.290/.291/.292
# 六版六证，v2 签名块实测）。改为入库固定 keystore 后所有构建同签名，覆盖安装恢复。
# 代价：任何拿到本仓库的人都能以同一签名构建伪装更新。本 fork 无商店渠道，可安装性优先于防伪；
# 若要换用私有 keystore（keystore.properties 不入库 + CI secrets），旧用户必须卸载重装，慎重。
#
# storeFile 相对 android/app/ 解析（app 模块的 file()）。
storeFile=folia-release.p12
storePassword=folia-android-keystore
keyAlias=folia
keyPassword=folia-android-keystore
storeType=PKCS12
# 证书 SHA-256：A8:ED:29:C8:78:07:D2:53:5B:A1:FD:3A:D3:7E:B4:0E:23:33:86:D6:06:DB:56:D2:D1:33:B8:CA:4D:FB:95:41
# 有效期至 2056-10-23。CI 的 android-pre-release workflow 会核对指纹，漂移即构建失败。
